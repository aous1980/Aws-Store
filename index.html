<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aws Store | Ultimate Edition - أندرويد وستلايت</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>

    <style>
        :root {
            --main-bg: #0b0f12;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-color: #ffffff;
            --accent: #00ff88; 
            --accent-blue: #00d2ff;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            --main-bg: #f0f2f5;
            --card-bg: rgba(0, 0, 0, 0.04);
            --text-color: #1a1a2e;
            --accent: #00b894;
            --accent-blue: #0984e3;
            --glass-border: rgba(0, 0, 0, 0.1);
        }

        body {
            background: var(--main-bg);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body:not([data-theme="light"]) {
            background: linear-gradient(-45deg, #0b0f12, #1a2a24, #0b0f12, #111d2b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-tools {
            position: fixed; 
            top: 20px; 
            left: 20px;
            display: flex; 
            gap: 10px; 
            z-index: 100;
        }

        .tool-btn {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            width: 42px; 
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            font-size: 20px;
        }

        .tool-btn:hover {
            border-color: var(--accent);
            transform: scale(1.05);
        }

        /* زر كتم الصوت - نبضات */
        .sound-btn {
            position: relative;
        }
        
        .sound-btn.playing {
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0, 255, 136, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }

        /* ========== الشعار الاحترافي ========== */
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .icon-combo {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .android-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #3DDC84, #00c853);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            bottom: 0;
            left: 0;
            box-shadow: 0 8px 20px rgba(61,220,132,0.4);
        }

        .android-icon span {
            font-size: 42px;
        }

        .satellite-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #00d2ff, #0099ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0;
            right: 0;
            box-shadow: 0 8px 20px rgba(0,210,255,0.4);
            border: 2px solid rgba(255,255,255,0.3);
        }

        .satellite-icon span {
            font-size: 32px;
        }

        .logo-text {
            text-align: right;
        }

        .logo-text h1 {
            font-size: 52px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0;
            background: linear-gradient(135deg, #00ff88, #00d2ff, #3DDC84);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo-text .sub {
            font-size: 13px;
            color: #888;
            letter-spacing: 1px;
            margin-top: 5px;
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        .sub span {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
        }

        .badge-android {
            background: rgba(61,220,132,0.15);
            border: 1px solid #3DDC84;
            color: #3DDC84;
        }

        .badge-satellite {
            background: rgba(0,210,255,0.15);
            border: 1px solid #00d2ff;
            color: #00d2ff;
        }

        .top-bar { max-width: 700px; margin: 0 auto 25px; display: flex; gap: 12px; animation: fadeInUp 1s ease; }
        .search-box { 
            flex: 2; background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); 
            padding: 14px; border-radius: 15px; color: var(--text-color); 
            outline: none; backdrop-filter: blur(15px); transition: 0.3s;
        }
        .search-box:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0,255,136,0.2); }

        .downloader-badge { 
            flex: 1; background: rgba(0, 210, 255, 0.1); border: 1px solid var(--accent-blue); 
            padding: 10px; border-radius: 15px; color: var(--accent-blue); 
            text-align: center; font-weight: bold; font-size: 0.8rem;
        }

        .quick-nav { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 30px; animation: fadeInUp 1.2s ease; }
        .nav-item { 
            background: var(--card-bg); border: 1px solid var(--glass-border); 
            padding: 8px 18px; border-radius: 20px; cursor: pointer; transition: 0.3s; color: var(--text-color); 
        }
        .nav-item.active { background: var(--accent); color: #000; font-weight: bold; }

        #categoriesContainer { max-width: 1200px; margin: auto; }
        .category-title { color: var(--accent); border-right: 4px solid var(--accent); padding-right: 12px; margin: 40px 0 20px; font-size: 1.3rem; }

        .apps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }

        .app-card { 
            background: var(--card-bg); backdrop-filter: blur(20px); 
            border: 1px solid var(--glass-border); border-radius: 25px; 
            padding: 22px; text-align: center; display: flex; flex-direction: column; 
            align-items: center; transition: 0.4s; color: var(--text-color);
            animation: fadeInUp 0.5s ease backwards;
        }
        .app-card:hover { border-color: var(--accent); transform: translateY(-10px) !important; box-shadow: 0 15px 35px rgba(0, 255, 136, 0.15); }

        .app-icon { width: 85px; height: 85px; border-radius: 22px; margin-bottom: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .features-row { display: flex; gap: 8px; margin: 10px 0; }
        .feat-tag { font-size: 10px; background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); }
        .app-notes { font-size: 0.8rem; opacity: 0.8; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 12px; margin: 12px 0; width: 100%; border-right: 3px solid var(--accent-blue); text-align: right; line-height: 1.4; }
        .download-btn { background: linear-gradient(45deg, var(--accent), var(--accent-blue)); color: #000; text-decoration: none; padding: 12px; border-radius: 12px; font-weight: bold; width: 100%; margin-top: auto; transition: 0.3s; }
        .download-btn:hover { filter: brightness(1.1); transform: scale(1.02); }

        @media (max-width: 768px) {
            .logo-container { flex-direction: column; text-align: center; }
            .logo-text { text-align: center; }
            .logo-text h1 { font-size: 36px; }
            .logo-text .sub { justify-content: center; }
            .icon-combo { margin-bottom: 10px; }
            .apps-grid { display: flex; overflow-x: auto; padding: 10px; gap: 15px; scroll-snap-type: x mandatory; }
            .app-card { min-width: 270px; scroll-snap-align: center; }
            .apps-grid::-webkit-scrollbar { height: 4px; }
            .apps-grid::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
        }
    </style>
</head>
<body>
    <!-- الأزرار العلوية (مشاركة + تبديل الوضع + كتم الصوت) -->
    <div class="header-tools">
        <button class="tool-btn" onclick="shareStore()" title="مشاركة المتجر">🔗</button>
        <button class="tool-btn" id="themeToggle" onclick="toggleTheme()" title="تبديل الوضع ليلي/نهاري">🌙</button>
        <button class="tool-btn sound-btn" id="soundToggle" onclick="toggleSound()" title="كتم/تشغيل الموسيقى">🔊</button>
    </div>

    <!-- الشعار الاحترافي -->
    <div class="logo-container">
        <div class="icon-combo">
            <div class="android-icon">
                <span>🤖</span>
            </div>
            <div class="satellite-icon">
                <span>📡</span>
            </div>
        </div>
        <div class="logo-text">
            <h1>AWS STORE</h1>
            <div class="sub">
                <span class="badge-android">📱 تطبيقات أندرويد</span>
                <span class="badge-satellite">📡 بث وستلايت</span>
            </div>
        </div>
    </div>

    <div class="top-bar">
        <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن تطبيقك المفضل..." oninput="filterApps()">
        <div class="downloader-badge">
            <span style="font-size: 0.65rem; opacity: 0.8;">Downloader Code</span>
            <span>4131623</span>
        </div> 
    </div>

    <div id="quickNav" class="quick-nav"></div>
    <div id="categoriesContainer"></div>

    <!-- عنصر الصوت (مخفي) -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBcWwHSDX9kWVxbw1DLgGkTJoYFSBsdeuk",
            authDomain: "aws-store-aaf40.firebaseapp.com",
            databaseURL: "https://aws-store-aaf40-default-rtdb.firebaseio.com",
            projectId: "aws-store-aaf40",
            appId: "1:962301504605:web:96661f5c465b2cfd4331b4"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let localApps = {};
        let localCats = [];
        let currentFilter = 'all';
        let currentSearch = '';
        
        // ========== إدارة الموسيقى ==========
        let isSoundEnabled = true;
        const bgMusic = document.getElementById('bgMusic');
        const soundBtn = document.getElementById('soundToggle');
        
        // ضبط مستوى الصوت
        bgMusic.volume = 0.3;
        
        // محاولة تشغيل الموسيقى تلقائياً عند تحميل الصفحة
        function playMusic() {
            bgMusic.play().then(() => {
                console.log("الموسيقى تعمل");
                soundBtn.innerHTML = "🔊";
                soundBtn.classList.add('playing');
                isSoundEnabled = true;
            }).catch(err => {
                console.log("المتصفح منع تشغيل الموسيقى تلقائياً:", err);
                // في بعض المتصفحات يحتاج المستخدم للتفاعل أولاً
                soundBtn.innerHTML = "🔇";
                soundBtn.classList.remove('playing');
                isSoundEnabled = false;
            });
        }
        
        function toggleSound() {
            if (isSoundEnabled) {
                // كتم الصوت
                bgMusic.pause();
                soundBtn.innerHTML = "🔇";
                soundBtn.classList.remove('playing');
                isSoundEnabled = false;
            } else {
                // تشغيل الصوت
                bgMusic.play().then(() => {
                    soundBtn.innerHTML = "🔊";
                    soundBtn.classList.add('playing');
                    isSoundEnabled = true;
                }).catch(err => {
                    console.log("حدث خطأ في تشغيل الموسيقى:", err);
                });
            }
        }
        
        // محاولة تشغيل الموسيقى عند أول تفاعل من المستخدم (للمتصفحات التي تمنع التشغيل التلقائي)
        function tryPlayOnInteraction() {
            if (!isSoundEnabled) {
                bgMusic.play().then(() => {
                    soundBtn.innerHTML = "🔊";
                    soundBtn.classList.add('playing');
                    isSoundEnabled = true;
                }).catch(err => console.log("تم منع التشغيل"));
            }
            // إزالة المستمعين بعد أول تفاعل
            document.removeEventListener('click', tryPlayOnInteraction);
            document.removeEventListener('touchstart', tryPlayOnInteraction);
        }
        
        // بدء الموسيقى عند تحميل الصفحة
        window.addEventListener('load', () => {
            playMusic();
        });
        
        // في حال فشل التشغيل التلقائي، ننتظر أي تفاعل من المستخدم
        document.addEventListener('click', tryPlayOnInteraction);
        document.addEventListener('touchstart', tryPlayOnInteraction);
        
        // ========== نهاية إدارة الموسيقى ==========

        function initTheme() {
            const savedTheme = localStorage.getItem('aws_store_theme');
            const themeBtn = document.getElementById('themeToggle');
            if (savedTheme === 'light') {
                document.body.setAttribute('data-theme', 'light');
                themeBtn.innerHTML = '🌞';
            } else {
                document.body.removeAttribute('data-theme');
                themeBtn.innerHTML = '🌙';
            }
        }
        
        function toggleTheme() {
            const themeBtn = document.getElementById('themeToggle');
            if (document.body.getAttribute('data-theme') === 'light') {
                document.body.removeAttribute('data-theme');
                localStorage.setItem('aws_store_theme', 'dark');
                themeBtn.innerHTML = '🌙';
            } else {
                document.body.setAttribute('data-theme', 'light');
                localStorage.setItem('aws_store_theme', 'light');
                themeBtn.innerHTML = '🌞';
            }
        }

        function renderNav() {
            const nav = document.getElementById('quickNav');
            nav.innerHTML = '<div class="nav-item active" onclick="changeCat(\'all\')">الكل</div>';
            
            localCats.forEach(cat => {
                nav.innerHTML += `<div class="nav-item" onclick="changeCat('${cat.name.replace(/'/g, "\\'")}')">${cat.name}</div>`;
            });
        }

        function changeCat(catName) {
            currentFilter = catName;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(catName === 'all') {
                document.querySelector('.nav-item').classList.add('active');
            } else {
                const items = document.querySelectorAll('.nav-item');
                for(let i = 1; i < items.length; i++) {
                    if(items[i].innerText === catName) items[i].classList.add('active');
                }
            }
            displayContent();
        }

        function filterApps() {
            currentSearch = document.getElementById('searchInput').value;
            displayContent();
        }

        function displayContent() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = "";
            let delay = 0;

            localCats.forEach(cat => {
                if (currentFilter !== 'all' && currentFilter !== cat.name) return;
                let appsHtml = "";
                Object.values(localApps).forEach(app => {
                    if (app.cat === cat.name && app.name.toLowerCase().includes(currentSearch.toLowerCase())) {
                        delay += 0.1;
                        appsHtml += `
                            <div class="app-card" data-tilt data-tilt-max="7" style="animation-delay: ${delay}s">
                                <img src="${app.img}" class="app-icon" onerror="this.src='https://i.ibb.co/F4px49v/default-icon.png'">
                                <div style="font-weight:bold; font-size: 1.1rem;">${app.name}</div>
                                <div class="features-row">
                                    <span class="feat-tag">🚀 سريع</span>
                                    <span class="feat-tag">🛡️ آمن</span>
                                    <span class="feat-tag">📺 4K</span>
                                </div>
                                <div style="color:var(--accent-blue); font-size:0.8rem; margin:5px 0;">Version ${app.ver}</div>
                                ${app.notes ? `<div class="app-notes">${app.notes}</div>` : ''}
                                <a href="${app.url}" class="download-btn" target="_blank">تحميل الآن</a>
                            </div>`;
                    }
                });
                if (appsHtml !== "") {
                    container.innerHTML += `<h2 class="category-title">📂 ${cat.name}</h2><div class="apps-grid">${appsHtml}</div>`;
                }
            });
            
            if (typeof VanillaTilt !== 'undefined') {
                VanillaTilt.init(document.querySelectorAll(".app-card"));
            }
        }

        function shareStore() {
            if (navigator.share) {
                navigator.share({ title: 'Aws Store', url: window.location.href }).catch(console.error);
            } else {
                prompt("انسخ رابط المتجر:", window.location.href);
            }
        }

        // الاستماع لقاعدة البيانات وترتيب الأقسام حسب order
        db.ref().on('value', snap => {
            const data = snap.val() || {};
            localApps = data.apps || {};
            
            const catsObj = data.categories || {};
            let catsArray = [];
            for(let key in catsObj) {
                catsArray.push({
                    name: catsObj[key].name,
                    order: catsObj[key].order || 0
                });
            }
            catsArray.sort((a, b) => a.order - b.order);
            localCats = catsArray;
            
            renderNav();
            displayContent();
        });

        initTheme();
    </script>
</body>
</html>
